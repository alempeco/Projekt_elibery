<app-header [title]="'Kategorije'"></app-header>

<div class="page-container">
  <div *ngIf="loading" class="loader-wrapper">
    <div class="loader"></div>
  </div>

  <app-search 
    [placeholderText]="'Pretraži naziv, opis...'" 
    (searchChange)="handleSearch($event)">
  </app-search>

  <div *ngIf="error" class="error-box">
    {{ error }}
  </div>

  <div *ngIf="!loading && filteredCategories.length" class="table-card">
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th class="id-col">ID</th>
            <th>Naziv Kategorije</th>
            <th>Opis</th>
          </tr>
        </thead>
        <tbody>
          <tr
            *ngFor="let cat of filteredCategories; let i = index"
            [class.row-even]="i % 2 === 0"
            [class.row-odd]="i % 2 !== 0"
          >
            <td class="id-cell">{{ cat.Id }}</td>
            <td class="name-cell">
              <span class="category-indicator"></span>
              {{ cat.Name }}
            </td>
            <td class="description-cell">
              {{ cat.Description }}
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <div *ngIf="!loading && !filteredCategories.length" class="empty-state">
    📭 Trenutno nema definisanih kategorija.
  </div>
</div>
