<div class="register-container">
  <h2>Registracija</h2>
  <form (ngSubmit)="onRegister()">
    <div>
      <label>First Name:</label>
      <input type="text" [(ngModel)]="firstName" name="firstName" required />
    </div>

    <div>
      <label>Last Name:</label>
      <input type="text" [(ngModel)]="lastName" name="lastName" required />
    </div>

    <div>
      <label>Email:</label>
      <input type="email" [(ngModel)]="email" name="email" required />
    </div>

    <div>
      <label>Password:</label>
      <input type="password" [(ngModel)]="password" name="password" required />
    </div>

    <div>
      <label>Role:</label>
      <select [(ngModel)]="role" name="role">
        <option value="student">Student</option>
        <option value="teacher">Teacher</option>
      </select>
    </div>

    <div>
      <label>Class:</label>
      <input type="text" [(ngModel)]="userClass" name="userClass" />
    </div>

    <button type="submit">Registruj se</button>
  </form>

  <p *ngIf="message" style="color:red">{{ message }}</p>
</div>
